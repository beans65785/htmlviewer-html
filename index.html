<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Live Previewer</title>
</head>
<body>

    <h1>HTML Render Lab</h1>
    
    <div>
        <button id="clearBtn">Clear</button>
        <button id="copyBtn">Copy Output</button>
    </div>

    <hr>

    <div style="display: flex; gap: 20px;">
        <div style="flex: 1;">
            <h3>HTML Input (<span id="charCount">0</span> characters)</h3>
            <textarea id="htmlInput" style="width: 100%; height: 400px; font-family: monospace;" placeholder="Type your HTML here..."></textarea>
        </div>

        <div style="flex: 1;">
            <h3>Preview Output</h3>
            <div id="previewOutput" style="border: 1px solid #ccc; padding: 10px; min-height: 400px;">
                </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
